; ============================================================================
;  esphishing  -  ESP32-S3 RF multitool (uso em pentest AUTORIZADO / analise RF)
; ----------------------------------------------------------------------------
;  Firmware principal:     pio run -e main          -t upload -t monitor
;  Teste de um modulo:     pio run -e test_display  -t upload -t monitor
;     envs de teste: test_display test_encoder test_cc1101 test_nrf24 test_wifi
; ============================================================================

[platformio]
default_envs = main

; ------- configuracao comum a todos os ambientes -------
[common]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; --- Serial pela porta USB nativa (use a porta "USB" do dev kit) ---
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; --- TFT_eSPI configurado AQUI (nunca edite a lib) ----------------
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1             ; padrao; alternativa: -DILI9341_2_DRIVER=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=10000000       ; 10 MHz: bem conservador p/ dupont/fio voador
    -DSPI_READ_FREQUENCY=6000000
    -DUSE_HSPI_PORT=1              ; FORCA o display no SPI3/HSPI; rádios ficam com o SPI2/FSPI
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    nrf24/RF24@^1.4.11
    madhephaestus/ESP32Encoder@^0.11.7
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git

; ------- firmware principal (tudo, menos a pasta tests/) -------
[env:main]
extends = common
build_src_filter = +<*> -<tests/>

; ------- ambientes de teste isolados (1 arquivo cada) -------
[env:test_display]
extends = common
build_src_filter = +<tests/test_display.cpp>

[env:test_encoder]
extends = common
build_src_filter = +<tests/test_encoder.cpp>

[env:test_cc1101]
extends = common
build_src_filter = +<tests/test_cc1101.cpp>

[env:test_nrf24]
extends = common
build_src_filter = +<tests/test_nrf24.cpp>

[env:test_wifi]
extends = common
build_src_filter = +<tests/test_wifi.cpp>
